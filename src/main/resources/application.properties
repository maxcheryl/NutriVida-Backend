spring.application.name=nutrivida-backend

# ==================== SERVIDOR ====================
server.port=8080

# ==================== BASE DE DATOS (XAMPP / MySQL) ====================
# Crear previamente base de datos llamada nutrivida
spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / HIBERNATE ====================
# La estructura la administra Flyway; validate solo comprueba que las tablas coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== FLYWAY ====================
spring.flyway.enabled=true

# ==================== JWT ====================
# Secret HMAC-SHA256 (base64)
app.jwt.secret=bmV0cml2aWRhLXNlY3JldC1qd3QtMjAyNi1kcy0xMTA0LWZ1bGxzdGFjaw==
app.jwt.access-expiration-minutes=30
app.jwt.refresh-expiration-days=7

# ==================== SPRINGDOC / SWAGGER ====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
